[project]
name = "iron-pgn-parser"
version = "0.1.1"
description = "A faster PGN parser made in rust"
readme = "README.md"
authors = [
    { name = "Louis Turpault", email = "louis.turpault@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "maturin>=1.15.0",
]

[project.scripts]
iron-pgn-parser = "iron_pgn_parser:main"

[build-system]
requires = ["maturin>=1.15.0"]
build-backend = "maturin"
